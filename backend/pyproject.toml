[project]
name = "hardware-upgrader-backend"
version = "0.1.0"
description = "Backend do sistema de diagnóstico e recomendação de upgrades de hardware."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) in defaults is the standard FastAPI pattern, not a bug.
# UP042: keep `str, Enum` (not StrEnum) — existing convention, avoids churn.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; not hand-formatted code.
"alembic/versions/*.py" = ["E501", "UP", "I001"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
